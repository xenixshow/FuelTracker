<svg xmlns="http://www.w3.org/2000/svg" width="360" height="780" viewBox="0 0 360 780">
  <rect width="360" height="780" rx="30" fill="#1C1B1F"/>
  <!-- Status bar -->
  <rect x="0" y="0" width="360" height="40" fill="#1C1B1F"/>
  <text x="30" y="28" fill="#FFF" font-size="14" font-family="sans-serif">12:00</text>
  <!-- Title -->
  <text x="30" y="80" fill="#4CAF50" font-size="24" font-weight="bold" font-family="sans-serif">📊 数据总览</text>
  <!-- Key metrics card -->
  <rect x="20" y="100" width="320" height="150" rx="16" fill="#2E7D32" opacity="0.3"/>
  <text x="40" y="130" fill="#FFF" font-size="18" font-weight="bold" font-family="sans-serif">🏆 核心指标</text>
  <text x="80" y="175" fill="#FFF" font-size="48" font-weight="bold" font-family="sans-serif">2.8</text>
  <text x="125" y="170" fill="#AAA" font-size="16" font-family="sans-serif">L/100km</text>
  <text x="100" y="200" fill="#888" font-size="14" font-family="sans-serif">平均油耗</text>
  <text x="240" y="175" fill="#FFF" font-size="48" font-weight="bold" font-family="sans-serif">2,924</text>
  <text x="290" y="170" fill="#AAA" font-size="16" font-family="sans-serif">km</text>
  <text x="260" y="200" fill="#888" font-size="14" font-family="sans-serif">总行驶里程</text>
  <!-- Chart -->
  <rect x="20" y="270" width="320" height="200" rx="16" fill="#2C2C2C"/>
  <text x="40" y="300" fill="#FFF" font-size="16" font-weight="bold" font-family="sans-serif">⛽ 百公里油耗走势</text>
  <polyline points="60,400 120,380 180,420 240,390 300,360" stroke="#66BB6A" stroke-width="3" fill="none"/>
  <circle cx="60" cy="400" r="4" fill="#66BB6A"/>
  <circle cx="120" cy="380" r="4" fill="#66BB6A"/>
  <circle cx="180" cy="420" r="4" fill="#66BB6A"/>
  <circle cx="240" cy="390" r="4" fill="#66BB6A"/>
  <circle cx="300" cy="360" r="4" fill="#66BB6A"/>
  <!-- Bottom nav -->
  <rect x="0" y="700" width="360" height="80" fill="#1C1B1F"/>
  <rect x="0" y="700" width="360" height="1" fill="#333"/>
  <text x="60" y="750" fill="#888" font-size="12" font-family="sans-serif" text-anchor="middle">添加记录</text>
  <text x="180" y="750" fill="#888" font-size="12" font-family="sans-serif" text-anchor="middle">历史记录</text>
  <text x="300" y="750" fill="#4CAF50" font-size="12" font-family="sans-serif" text-anchor="middle">统计图表</text>
</svg>
