<svg xmlns="http://www.w3.org/2000/svg" width="360" height="780" viewBox="0 0 360 780">
  <rect width="360" height="780" rx="30" fill="#1C1B1F"/>
  <rect x="0" y="0" width="360" height="40" fill="#1C1B1F"/>
  <text x="30" y="28" fill="#FFF" font-size="14" font-family="sans-serif">12:00</text>
  <text x="30" y="80" fill="#4CAF50" font-size="24" font-weight="bold" font-family="sans-serif">⛽ 添加加油记录</text>
  <!-- Vehicle selector -->
  <rect x="20" y="100" width="320" height="50" rx="8" stroke="#4CAF50" stroke-width="1" fill="none"/>
  <text x="40" y="130" fill="#FFF" font-size="15" font-family="sans-serif">🚗 小踏板 · 续航 200km  ▼</text>
  <!-- Date field -->
  <rect x="20" y="165" width="320" height="55" rx="8" stroke="#555" stroke-width="1" fill="none"/>
  <text x="40" y="190" fill="#FFF" font-size="15" font-family="sans-serif">📅 2026-06-09</text>
  <text x="40" y="208" fill="#888" font-size="12" font-family="sans-serif">日期</text>
  <!-- Time field -->
  <rect x="20" y="230" width="320" height="55" rx="8" stroke="#555" stroke-width="1" fill="none"/>
  <text x="40" y="255" fill="#FFF" font-size="15" font-family="sans-serif">⏰ 14:30</text>
  <text x="40" y="273" fill="#888" font-size="12" font-family="sans-serif">时间</text>
  <!-- Mileage field -->
  <rect x="20" y="295" width="320" height="55" rx="8" stroke="#555" stroke-width="1" fill="none"/>
  <text x="40" y="320" fill="#FFF" font-size="15" font-family="sans-serif">🏎️ 7737</text>
  <text x="40" y="338" fill="#888" font-size="12" font-family="sans-serif">里程数 (km)</text>
  <!-- Fuel volume -->
  <rect x="20" y="360" width="320" height="55" rx="8" stroke="#4CAF50" stroke-width="1" fill="none"/>
  <text x="40" y="385" fill="#FFF" font-size="15" font-family="sans-serif">⛽ 5.11</text>
  <text x="40" y="403" fill="#4CAF50" font-size="12" font-family="sans-serif">🔒 自动根据油价×费用计算</text>
  <!-- Fuel price -->
  <rect x="20" y="425" width="320" height="55" rx="8" stroke="#555" stroke-width="1" fill="none"/>
  <text x="40" y="450" fill="#FFF" font-size="15" font-family="sans-serif">💰 8.30</text>
  <text x="40" y="468" fill="#888" font-size="12" font-family="sans-serif">油价 (元/升)</text>
  <!-- Total cost -->
  <rect x="20" y="490" width="320" height="55" rx="8" stroke="#555" stroke-width="1" fill="none"/>
  <text x="40" y="515" fill="#FFF" font-size="15" font-family="sans-serif">💳 42.40</text>
  <text x="40" y="533" fill="#888" font-size="12" font-family="sans-serif">加油费用 (元)</text>
  <!-- Save button -->
  <rect x="20" y="560" width="320" height="48" rx="24" fill="#4CAF50"/>
  <text x="180" y="590" fill="#FFF" font-size="16" font-weight="bold" font-family="sans-serif" text-anchor="middle">💾 保存记录</text>
  <!-- Bottom nav -->
  <rect x="0" y="700" width="360" height="80" fill="#1C1B1F"/>
  <rect x="0" y="700" width="360" height="1" fill="#333"/>
  <text x="60" y="750" fill="#4CAF50" font-size="12" font-family="sans-serif" text-anchor="middle">添加记录</text>
  <text x="180" y="750" fill="#888" font-size="12" font-family="sans-serif" text-anchor="middle">历史记录</text>
  <text x="300" y="750" fill="#888" font-size="12" font-family="sans-serif" text-anchor="middle">统计图表</text>
</svg>
